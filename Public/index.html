<!DOCTYPE html>
<html>
<head>
  <title>Codsworth Demo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1a1d21;
      color: white;
      max-width: 700px;
      margin: 50px auto;
      padding: 20px;
    }

    .chat {
      background: #222529;
      padding: 20px;
      border-radius: 12px;
      min-height: 300px;
    }

    button {
      padding: 12px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #response {
      margin-top: 20px;
      padding: 15px;
      background: #30343b;
      border-radius: 8px;
      white-space: pre-line;
    }
  </style>
</head>

<body>

  <h1>🤖 Codsworth</h1>

  <p>Try Codsworth's commands!</p>

  <div class="chat">

    <button onclick="runCommand('ping')">
      📶 /codsworth-ping
    </button>

    <button onclick="runCommand('joke')">
      🤡 /codsworth-joke
    </button>

    <button onclick="runCommand('catfact')">
      🐱 /codsworth-catfact
    </button>

    <button onclick="runCommand('help')">
      🛠️ /codsworth-help
    </button>

    <div id="response">
      Choose a command...
    </div>

  </div>

  <script>

    async function runCommand(command) {

      const responseBox = document.getElementById("response");

      responseBox.textContent = "Codsworth is thinking... 🤔";

      const response = await fetch(`/api/${command}`);

      const data = await response.json();

      responseBox.textContent = data.message;
    }

  </script>

</body>
</html>
